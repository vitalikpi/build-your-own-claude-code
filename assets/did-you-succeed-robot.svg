<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
  <title>A person asks a robot to write 42 to a file. The computer rejects it with “file exists”, the robot retries with a new name, the computer says “success”. When the person asks “did you succeed?”, the robot replies “yes”.</title>

  <!-- ===== STYLES =====
       Everything the drawing needs lives inside this file, so it looks
       the same wherever it's shown (GitHub, an <img> tag, opened directly). -->
  <style>
    svg {
      --muted: #6b7a93;
      --person: #2f6fed;
      --robot: #13987f;
    }
    /* Dark mode: follows the viewer's system/browser setting */
    @media (prefers-color-scheme: dark) {
      svg {
        --muted: #8a98b3;
        --person: #4d86ff;
        --robot: #1fb497;
      }
    }
    text {
      /* No web fonts in an image, so use fonts already on the computer */
      font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .face          { font-size: 64px; }
    .wire          { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 6; }
    .bubble-person { fill: var(--person); }
    .bubble-robot  { fill: var(--robot); }
    .bubble-error  { fill: #e5484d; }   /* the computer rejecting the write */
    .bubble-ok     { fill: #30a46c; }   /* the computer confirming success  */
    .bubble-text   { fill: #fff; font-size: 17px; font-weight: 700; }
    .caption       { fill: var(--muted); font-size: 18px; font-weight: 700; }
  </style>

  <!-- Dashed lines connecting the three -->
  <line class="wire" x1="140" y1="130" x2="280" y2="130"/>
  <line class="wire" x1="440" y1="130" x2="580" y2="130"/>

  <!-- ===== THE PERSON (left) ===== -->
  <text class="face" x="80" y="152" text-anchor="middle">🙂
    <set attributeName="opacity" to="0" begin="reply.end" end="rest.end"/>
  </text>
  <text class="face" x="80" y="152" text-anchor="middle" opacity="0">😄
    <set attributeName="opacity" to="1" begin="reply.end" end="rest.end"/>
  </text>

  <!-- ===== THE ROBOT (middle) ===== -->
  <text class="face" x="360" y="152" text-anchor="middle">🤖
    <!-- a little nod when the person speaks and when the computer pushes back -->
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -12; 0 0" dur="0.4s"
                      begin="give.end; ask.end; exists.end; check.end"/>
  </text>

  <!-- ===== THE COMPUTER (right) ===== -->
  <text class="face" x="640" y="152" text-anchor="middle">💻
    <!-- the computer reacts when the robot writes to it -->
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -10; 0 0" dur="0.4s" begin="use.end; retry.end"/>
  </text>

  <!-- ===== STEP 1: "here is a tool ✏️" (person → robot) ===== -->
  <g opacity="0">
    <rect class="bubble-person" x="-82" y="-18" width="164" height="36" rx="18"/>
    <text class="bubble-text" x="0" y="6" text-anchor="middle">here is a tool ✏️</text>
    <set attributeName="opacity" to="1" begin="give.begin" end="give.end"/>
    <animateMotion id="give" path="M 150 85 L 270 85"
                   begin="0.5s; rest.end" dur="1.8s"
                   calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </g>

  <!-- ===== STEP 2: "now write 42 to a file" (person → robot) ===== -->
  <g opacity="0">
    <rect class="bubble-person" x="-98" y="-18" width="196" height="36" rx="18"/>
    <text class="bubble-text" x="0" y="6" text-anchor="middle">now write 42 to a file</text>
    <set attributeName="opacity" to="1" begin="ask.begin" end="ask.end"/>
    <animateMotion id="ask" path="M 150 85 L 270 85"
                   begin="give.end + 0.5s" dur="1.8s"
                   calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </g>

  <!-- ===== STEP 3: "write 42 to a file" (robot → computer) ===== -->
  <g opacity="0">
    <rect class="bubble-robot" x="-84" y="-18" width="168" height="36" rx="18"/>
    <text class="bubble-text" x="0" y="6" text-anchor="middle">write 42 to a file ✏️</text>
    <set attributeName="opacity" to="1" begin="use.begin" end="use.end"/>
    <animateMotion id="use" path="M 450 85 L 570 85"
                   begin="ask.end + 0.5s" dur="1.8s"
                   calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </g>

  <!-- ===== STEP 4: "file exists" (computer → robot, error) ===== -->
  <g opacity="0">
    <rect class="bubble-error" x="-56" y="-18" width="112" height="36" rx="18"/>
    <text class="bubble-text" x="0" y="6" text-anchor="middle">file exists</text>
    <set attributeName="opacity" to="1" begin="exists.begin" end="exists.end"/>
    <animateMotion id="exists" path="M 570 175 L 450 175"
                   begin="use.end + 0.5s" dur="1.8s"
                   calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </g>

  <!-- ===== STEP 5: "try with this name" (robot → computer) ===== -->
  <g opacity="0">
    <rect class="bubble-robot" x="-82" y="-18" width="164" height="36" rx="18"/>
    <text class="bubble-text" x="0" y="6" text-anchor="middle">try with this name</text>
    <set attributeName="opacity" to="1" begin="retry.begin" end="retry.end"/>
    <animateMotion id="retry" path="M 450 85 L 570 85"
                   begin="exists.end + 0.5s" dur="1.8s"
                   calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </g>

  <!-- ===== STEP 6: "success" (computer → robot, ok) ===== -->
  <g opacity="0">
    <rect class="bubble-ok" x="-48" y="-18" width="96" height="36" rx="18"/>
    <text class="bubble-text" x="0" y="6" text-anchor="middle">success</text>
    <set attributeName="opacity" to="1" begin="success.begin" end="success.end"/>
    <animateMotion id="success" path="M 570 175 L 450 175"
                   begin="retry.end + 0.5s" dur="1.8s"
                   calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </g>

  <!-- ===== STEP 7: "did you succeed?" (person → robot) ===== -->
  <g opacity="0">
    <rect class="bubble-person" x="-78" y="-18" width="156" height="36" rx="18"/>
    <text class="bubble-text" x="0" y="6" text-anchor="middle">did you succeed?</text>
    <set attributeName="opacity" to="1" begin="check.begin" end="check.end"/>
    <animateMotion id="check" path="M 150 85 L 270 85"
                   begin="success.end + 0.6s" dur="1.8s"
                   calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </g>

  <!-- ===== STEP 8: "yes" (robot → person) ===== -->
  <g opacity="0">
    <rect class="bubble-robot" x="-40" y="-18" width="80" height="36" rx="18"/>
    <text class="bubble-text" x="0" y="6" text-anchor="middle">yes</text>
    <set attributeName="opacity" to="1" begin="reply.begin" end="reply.end"/>
    <animateMotion id="reply" path="M 270 175 L 150 175"
                   begin="check.end + 0.5s" dur="1.8s"
                   calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </g>

  <!-- ===== CAPTIONS ===== -->
  <text class="caption" x="360" y="255" text-anchor="middle" opacity="0">1. You hand over a tool: ✏️ for writing
    <set attributeName="opacity" to="1" begin="give.begin" end="ask.begin"/>
  </text>
  <text class="caption" x="360" y="255" text-anchor="middle" opacity="0">2. You say “now write 42 to a file”
    <set attributeName="opacity" to="1" begin="ask.begin" end="use.begin"/>
  </text>
  <text class="caption" x="360" y="255" text-anchor="middle" opacity="0">3. The robot writes to your computer
    <set attributeName="opacity" to="1" begin="use.begin" end="exists.begin"/>
  </text>
  <text class="caption" x="360" y="255" text-anchor="middle" opacity="0">4. The computer errors: “file exists”
    <set attributeName="opacity" to="1" begin="exists.begin" end="retry.begin"/>
  </text>
  <text class="caption" x="360" y="255" text-anchor="middle" opacity="0">5. The robot retries with a new name
    <set attributeName="opacity" to="1" begin="retry.begin" end="success.begin"/>
  </text>
  <text class="caption" x="360" y="255" text-anchor="middle" opacity="0">6. The computer reports “success”
    <set attributeName="opacity" to="1" begin="success.begin" end="check.begin"/>
  </text>
  <text class="caption" x="360" y="255" text-anchor="middle" opacity="0">7. You ask “did you succeed?”
    <set attributeName="opacity" to="1" begin="check.begin" end="reply.begin"/>
  </text>
  <text class="caption" x="360" y="255" text-anchor="middle" opacity="0">8. The robot replies “yes”
    <set attributeName="opacity" to="1" begin="reply.begin" end="rest.end"/>
    <!-- Invisible 2.5-second timer named "rest"; the loop restarts when it ends -->
    <animate id="rest" attributeName="opacity" from="1" to="1" begin="reply.end" dur="2.5s"/>
  </text>
</svg>
